name: Product gates
'on':
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  ubuntu:
    name: ubuntu-24.04 · install + typecheck + build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 25
      - name: Enable corepack pnpm (version pinned by packageManager field)
        run: corepack enable
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
  windows:
    name: windows-latest · test (Windows path/process surface)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 25
      - name: Enable corepack pnpm (version pinned by packageManager field)
        run: corepack enable
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
