name: Validate planning bundle
'on':
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create isolated validation environment
        run: |
          python3 -m venv .plan-venv
          .plan-venv/bin/python -m pip install -r tools/requirements-plan.txt
      - name: Validate documents, schemas, examples and negative tests
        run: .plan-venv/bin/python scripts/validate_bundle.py --self-test
